<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <!-- 嚴格禁止縮放，防止雙擊放大畫面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Idle 微積分學習放置遊戲</title>

    <!-- PWA / 平板 App 支援設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Matter.js 物理引擎 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <!-- KaTeX 數學排版 CDN 支援 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* 左側遊戲物理畫面區域 */
        #game-container {
            flex: 1;
            position: relative;
            background-color: #1a1a1a;
            height: 100%;
        }

        /* 右側控制面板：改為允許內部捲動，避免被擠壓 */
        #control-panel {
            width: 420px;
            background-color: #1f1f1f;
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
            height: 100vh;
            overflow-y: auto;
            /* 支援內部上下捲動 */
        }

        .panel-section {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #f39c12;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #f1c40f;
        }

        .status-box {
            font-size: 0.9rem;
            color: #b2bec3;
            line-height: 1.4;
        }

        /* 視角上下切換按鈕群 */
        .camera-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .cam-btn {
            flex: 1;
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .cam-btn:hover {
            background-color: #2c3e50;
        }

        .prestige-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .prestige-btn:hover {
            background-color: #c0392b;
        }

        .error-log-btn {
            background-color: #8e44ad;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .error-log-btn:hover {
            background-color: #732d91;
        }

        .login-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background-color: #219653;
        }

        /* 題庫與答題介面 */
        #quiz-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        #question-text {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #ecf0f1;
        }

        #options-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .option-btn:hover {
            background-color: #2980b9;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        #feedback {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
            color: #2ecc71;
        }
    </style>
</head>

<body>

    <!-- 左側：Matter.js 物理掉落遊戲畫面 -->
    <div id="game-container"></div>

    <!-- 右側：控制面板 -->
    <div id="control-panel">

        <!-- 數據儀表板與身分設定 -->
        <div class="panel-section">
            <h1>💰 放置產出</h1>
            <div class="stat-box">金幣: <span id="gold-display">0.00</span></div>
            <div class="status-box" id="status-display">已解鎖關卡: 1/8 | 球價值: $1.00 | 速度: 10.0s</div>
            <div class="status-box" id="user-display" style="margin-top: 6px; color: #f39c12; font-size: 0.85rem;">目前玩家:
                載入中...</div>

            <div class="camera-controls">
                <button class="cam-btn" onclick="scrollCamera(-1)">⬆️ 往上視圖</button>
                <button class="cam-btn" onclick="scrollCamera(1)">⬇️ 往下視圖</button>
            </div>

            <button class="prestige-btn" onclick="triggerPrestige()">👑 啟動 Prestige 轉生</button>
            <button class="error-log-btn" onclick="openErrorLogModal()">📖 查看錯題本</button>
            <button class="login-btn" onclick="openLoginModal()">👤 切換/登入帳號</button>
        </div>

        <!-- 答題挑戰區 -->
        <div class="panel-section" id="quiz-container">
            <div>
                <h1>🎯 知識解鎖挑戰</h1>
                <div id="question-text">載入題庫中...</div>
                <div id="options-area"></div>
            </div>
            <div id="feedback"></div>
        </div>

    </div>

    <!-- 錯題本彈出視窗（含即時答題統計） -->
    <div id="error-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: #2a2a2a; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid #444;">
            <h2 style="color: #e74c3c; margin-bottom: 12px;">📖 微積分學習紀錄與錯題本</h2>

            <!-- 答題統計面板 -->
            <div id="quiz-stats-summary"
                style="background: #1f1f1f; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: flex; justify-content: space-around; text-align: center; border: 1px solid #333;">
                <div>
                    <div style="font-size: 0.8rem; color: #b2bec3;">總答題數</div>
                    <div id="stat-total" style="font-size: 1.2rem; font-weight: bold; color: #f1c40f;">0</div>
                </div>
                <div>
                    <div style="font-size: 0.8rem; color: #b2bec3;">答對題數</div>
                    <div id="stat-correct" style="font-size: 1.2rem; font-weight: bold; color: #2ecc71;">0</div>
                </div>
                <div>
                    <div style="font-size: 0.8rem; color: #b2bec3;">答對率</div>
                    <div id="stat-rate" style="font-size: 1.2rem; font-weight: bold; color: #3498db;">0.0%</div>
                </div>
            </div>

            <div id="error-list-container"
                style="margin-bottom: 20px; color: #ecf0f1; font-size: 0.95rem; max-height: 40vh; overflow-y: auto;">
                目前沒有錯題紀錄！
            </div>
            <button onclick="closeErrorLogModal()"
                style="background: #c0392b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">關閉</button>
        </div>
    </div>

    <!-- 登入/設定使用者帳號彈出視窗 -->
    <div id="login-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1100; justify-content: center; align-items: center;">
        <div
            style="background: #2a2a2a; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #444; text-align: center;">
            <h2 style="color: #2ecc71; margin-bottom: 12px;">👤 設定你的玩家代號</h2>
            <p style="color: #b2bec3; font-size: 0.9rem; margin-bottom: 16px;">輸入你的專屬代號，進度將自動同步至雲端與本機，平板重新整理或滑掉也不會遺失！
            </p>
            <input type="text" id="username-input" placeholder="例如: student_alex"
                style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; margin-bottom: 16px; text-align: center;">
            <div style="display: flex; gap: 10px;">
                <button onclick="saveUsername()"
                    style="flex: 1; background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">確定登入</button>
                <button onclick="closeLoginModal()"
                    style="flex: 1; background: #7f8c8d; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">取消</button>
            </div>
        </div>
    </div>

    <!-- 遊戲核心邏輯 -->
    <script src="game.js"></script>
</body>

</html>
